name: Publish

# Tag-driven publish to the public npm registry.
#
# Push a `v<semver>` tag (e.g. `v0.1.0`) to publish both packages at that
# version. The tag SHA must already be on `main` and have green CI; this
# workflow re-runs typecheck + test + build as a defence-in-depth gate but
# does not weaken the requirement that main was already green.
#
# Why tag-driven (not push-to-main): both packages are version-coupled
# (ohip peerDeps on contract), most main commits don't bump versions, and
# `npm publish` of an already-published version fails noisily. Tagging
# makes publishes deliberate and rare; ordinary merges to main do nothing.
#
# Auth: npm Trusted Publishing (OIDC). The `id-token: write` permission
# below lets the runner mint a short-lived OIDC token that npm exchanges
# for a publish credential — no long-lived NPM_TOKEN secret required.
# Trusted Publisher must be configured per-package on npmjs.com, scoped
# to this repo + workflow filename.
#
# Why this workflow uses `pnpm pack` + `npm publish` (not `pnpm publish`):
# the OIDC token-exchange handshake against `/-/npm/v1/oidc/token/exchange`
# is implemented in npm CLI ≥11.5.1. pnpm 10.29's publish path doesn't
# perform that exchange — with no .npmrc auth it fails ENEEDAUTH; with
# a placeholder .npmrc it fails 404. So we let pnpm produce the tarball
# (it correctly rewrites `workspace:` protocol ranges to concrete versions
# during pack) and let npm CLI do the actual upload + OIDC exchange.
#
# actions/setup-node is intentionally NOT given `registry-url` / `scope`
# because those inputs write `~/.npmrc` with a placeholder
# `_authToken=${NODE_AUTH_TOKEN}` that overrides OIDC. Each package's
# `publishConfig.registry` already pins the registry URL.
#
# Provenance: `--provenance` produces an SLSA build attestation linking
# the published tarball to this workflow run + the tag SHA. Verifiable
# from `npm view <pkg>` and via `npm audit signatures`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build

      # Node 22's bundled npm is 10.x; OIDC token-exchange landed in 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version

      - name: Publish @loomantix/billing-adapter
        working-directory: packages/billing-adapter
        run: |
          pnpm pack --pack-destination ./pack
          npm publish ./pack/*.tgz --access public --provenance

      - name: Publish @loomantix/billing-adapter-ohip
        working-directory: packages/billing-adapter-ohip
        run: |
          pnpm pack --pack-destination ./pack
          npm publish ./pack/*.tgz --access public --provenance
