# Sync canonical files from loomantix/claude-platform — produces verified commits.
#
# Adapted from the canonical template at:
# https://github.com/loomantix/claude-platform/blob/main/.github/workflows/sync-from-upstream.yml.template
#
# Billing-substrate-specific values:
#   - Targets `main`
#   - Uses the `loomantix` GitHub App via LOOM_BOT_APP_ID / LOOM_BOT_APP_PRIVATE_KEY
#     (org-installed with `contents: write` and `pull_requests: write`)
#   - Anonymous clone of the upstream — claude-platform is public, no read token needed
#
# Trust model: Job A clones upstream and runs `sync-engine.py` under
# `permissions: { contents: read }` with no App token, then hands a tarball
# + git-status manifest to Job B. Job B holds the App installation token
# but only runs the consumer-vendored `.github/scripts/create-signed-commit.py`
# against Job A's payload — it never executes upstream-cloned code. A
# compromise of upstream `sync-engine.py` cannot reach the bot token.
#
# `UPSTREAM_REF` is a tag (`sync-v1`), not `main`, so upstream merges don't
# auto-propagate; bumping the tag is the deliberate ship gate.
#
# Kill switch: `SKIP_UPSTREAM_SYNC` repo variable.

name: Sync from upstream

on:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-from-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: loomantix/claude-platform
  UPSTREAM_REF: sync-v1
  SYNC_BRANCH_PREFIX: sync/upstream
  PR_BASE_BRANCH: main

jobs:
  sync-build:
    # Untrusted job — runs upstream-cloned sync-engine.py. No App token,
    # contents: read only. Output is a tarball + manifest of changes.
    if: vars.SKIP_UPSTREAM_SYNC == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      PAYLOAD_DIR: /tmp/sync-payload
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_BASE_BRANCH }}
          persist-credentials: false # upstream code runs next; leave no auth on disk

      - name: Clone upstream
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream # warm-runner / rerun safety

          mkdir -p /tmp/upstream
          cd /tmp/upstream
          git init -q
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          # Disambiguate via ls-remote so that network failures fail loud at
          # the probe step rather than falling through into a branch fetch
          # (which would silently ship branch content as a "verified sync
          # from <tag>" — exactly what the trust model promises won't happen).
          if git ls-remote --tags --exit-code origin "${UPSTREAM_REF}" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/${UPSTREAM_REF}:refs/tags/${UPSTREAM_REF}"
          elif git ls-remote --heads --exit-code origin "${UPSTREAM_REF}" >/dev/null; then
            git fetch --depth=1 origin "${UPSTREAM_REF}"
          else
            echo "::error::UPSTREAM_REF '${UPSTREAM_REF}' is neither a tag nor a branch on ${UPSTREAM_REPO}." >&2
            exit 1
          fi
          git checkout -q FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install 'pyyaml==6.0.2'

      - name: Run sync engine
        run: |
          set -euo pipefail
          python3 /tmp/upstream/scripts/sync-engine.py \
            --upstream-repo /tmp/upstream \
            --consumer-dir .

      - name: Detect changes + build payload
        id: diff
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already in sync with upstream"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short

          # Payload layout for Job B:
          #   manifest      raw `git status --porcelain=v1 -z -uall` bytes
          #   tree.tar.gz   post-sync working tree (.git excluded)
          # -uall is required: untracked directories otherwise collapse to a
          # single `?? dir/` entry, which the vendored script can't expand.
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          git status --porcelain=v1 -z -uall > "$PAYLOAD_DIR/manifest"
          # Catch truncation: redirection failures don't trigger set -e, so
          # explicitly verify the file exists and is non-empty before tar.
          [ -s "$PAYLOAD_DIR/manifest" ] || { echo "::error::empty manifest written"; exit 1; }
          tar --exclude='./.git' -czf "$PAYLOAD_DIR/tree.tar.gz" .
          # Smoke-test the tarball: `tar -czf` can return 0 on mode-warning
          # edge cases, and a corrupt or empty archive would deadlock Job B.
          [ -s "$PAYLOAD_DIR/tree.tar.gz" ] || { echo "::error::empty tarball written"; exit 1; }
          tar -tzf "$PAYLOAD_DIR/tree.tar.gz" >/dev/null

      - name: Upload payload artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-payload
          path: ${{ env.PAYLOAD_DIR }}
          retention-days: 1
          if-no-files-found: error

  sync-commit:
    # Trusted job — holds the App installation token. Only runs the
    # consumer-vendored create-signed-commit.py against Job A's payload.
    # Never executes upstream-cloned code.
    needs: sync-build
    if: needs.sync-build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # for actions/checkout's GITHUB_TOKEN fallback; gh + API calls below use App token via env, not GITHUB_TOKEN
    env:
      PAYLOAD_DIR: /tmp/sync-payload
    steps:
      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.LOOM_BOT_APP_ID }}
          private-key: ${{ secrets.LOOM_BOT_APP_PRIVATE_KEY }}

      - name: Checkout consumer repo (for vendored scripts only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PR_BASE_BRANCH }}
          persist-credentials: false # gh + API use the App token via env, not git creds

      - name: Download payload artifact
        if: needs.sync-build.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-payload
          path: ${{ env.PAYLOAD_DIR }}

      - name: Extract payload tree
        run: |
          set -euo pipefail
          rm -rf "$PAYLOAD_DIR/tree"
          mkdir -p "$PAYLOAD_DIR/tree"
          # PEP 706 `data` filter rejects absolute paths, `..` traversal,
          # symlinks, hardlinks, device files, and special metadata before
          # any member is written. Plain `tar -xzf` does none of these at
          # extract time — a crafted member could otherwise land outside
          # the tree dir before the post-extract symlink scan ran. Sync
          # engine emits regular files only; the filter is fail-closed
          # defense in depth.
          python3 - "$PAYLOAD_DIR/tree.tar.gz" "$PAYLOAD_DIR/tree" <<'PYEOF'
          import sys, tarfile
          src, dst = sys.argv[1], sys.argv[2]
          with tarfile.open(src, "r:gz") as tf:
              tf.extractall(dst, filter="data")
          PYEOF
          # Belt-and-suspenders: `data` filter already drops symlinks, but
          # a future Python/tarfile regression would still be caught here.
          if find "$PAYLOAD_DIR/tree" -type l -print -quit | grep -q .; then
            echo "::error::payload tarball contains symlinks; aborting"
            find "$PAYLOAD_DIR/tree" -type l
            exit 1
          fi

      - name: Create signed commit + open / refresh sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          BRANCH="${SYNC_BRANCH_PREFIX}-${DATE}"

          # Close stale sync PRs. Capture `gh pr list` into a variable
          # first so `set -e` surfaces its exit status — process
          # substitution `< <(gh pr list ...)` would silently swallow a
          # producer failure (empty input → loop skips, workflow proceeds).
          # Here-string (`<<<`) keeps the while body in the parent shell
          # so `gh pr close` failures still fail the job. Exclude $BRANCH
          # itself so a same-day workflow_dispatch rerun doesn't close
          # (and leave closed) the PR it's about to refresh — gh pr edit
          # won't reopen.
          PRIORS=$(gh pr list \
            --state open \
            --limit 100 \
            --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"${SYNC_BRANCH_PREFIX}-\")) | select(.headRefName != \"${BRANCH}\") | .number")
          while read -r prior; do
            [ -z "$prior" ] && continue
            echo "Closing prior sync PR #$prior"
            gh pr close "$prior" --delete-branch \
              --comment "Superseded by today's sync run."
          done <<< "$PRIORS"

          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          python3 .github/scripts/create-signed-commit.py \
            --owner "$OWNER" \
            --repo "$REPO" \
            --base-branch "${PR_BASE_BRANCH}" \
            --new-branch "$BRANCH" \
            --message "chore: sync from ${UPSTREAM_REPO}@${UPSTREAM_REF}" \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --payload-dir "$PAYLOAD_DIR/tree" \
            --manifest "$PAYLOAD_DIR/manifest"

          PR_TITLE="Sync from ${UPSTREAM_REPO}"
          PR_BODY="Automated sync from \`${UPSTREAM_REPO}@${UPSTREAM_REF}\`. Review the diff carefully before merging — substituted content reflects current \`.platform-config.yml\`."
          # Explicit existence check beats substring-matching `gh pr create`
          # stderr — "already exists" appears in unrelated gh errors too.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists — refreshing"
            gh pr edit "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create \
              --base "${PR_BASE_BRANCH}" \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" 2> >(sed -E 's/(ghs_|ghp_|gho_|ghu_|github_pat_)[A-Za-z0-9_]+/<token-redacted>/g' >&2)
          fi
