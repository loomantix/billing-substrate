# Gemini Code Review workflow.
#
# Manual-only via `workflow_dispatch`. There is no `pull_request` trigger:
# fork PRs running with secret access is the textbook secret-exfiltration
# vector, and gating reviews behind explicit dispatch keeps cost bounded
# while the PR comment thread serves as audit trail.
#
# Repo-specific config lives out-of-band:
#   - .github/gemini-review-instructions.md — reviewer persona, priorities, stack context
#   - GEMINI_API_KEY repo secret — provisioned in Actions secrets
#
name: Gemini Code Review

on:
  # Default tier is flash (cheap, $0.05-$0.20/review). UI clickers selecting
  # `pro` ($1-$8/review) is a deliberate, visible choice.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      tier:
        description: 'Review tier — flash (cheap, ~$0.05-$0.20/review) or pro (deep, ~$1-$8/review, full reference tree)'
        required: false
        type: choice
        options: [flash, pro]
        default: flash

concurrency:
  group: gemini-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # On `workflow_dispatch`, `actions/checkout` defaults to the branch
      # selected when the workflow was triggered (typically the default
      # branch), not the PR head. The diff is fetched separately via
      # `gh pr diff`, but the full-file-content block is read from the
      # on-disk checkout — so without this, manual re-runs compare a
      # post-patch diff against a pre-patch file body and Gemini produces
      # false-positive 🔴 findings accusing the author of uncommitted
      # changes.
      #
      # `pull_request` already resolves the right ref via checkout's
      # event-context default, so we only override on `workflow_dispatch`.
      # Empty output → checkout uses its default.
      - name: Determine checkout ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Defense-in-depth — the workflow_dispatch input is declared
            # `type: number` and `required: true`, so the GitHub UI/API
            # blocks normal callers from supplying empty / non-numeric
            # values. Re-validate before interpolating into the ref to
            # rule out adversarial inputs that could reach the workflow
            # via API write paths.
            #
            # Use bash's single-string regex match (`[[ "$x" =~ pat ]]`)
            # rather than `echo "$x" | grep -qE`. `grep` matches per
            # line, so a multi-line input like "123\nFOO=bar" would
            # pass `^[1-9][0-9]*$` on its first line, and then
            # `echo "ref=refs/pull/${INPUT_PR}/head" >> "$GITHUB_OUTPUT"`
            # would inject extra entries into $GITHUB_OUTPUT (output
            # injection). The `[[ =~ ]]` form treats the variable as a
            # single string, so embedded newlines / control chars
            # cause the match to fail.
            if ! [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid pr_number input (expected a positive integer)"
              exit 1
            fi
            echo "ref=refs/pull/${INPUT_PR}/head" >> "$GITHUB_OUTPUT"
            echo "📌 Checking out PR head: refs/pull/${INPUT_PR}/head"
          else
            echo "📌 Using checkout's event-context default ref for event=$EVENT_NAME"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Determine PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=${INPUT_PR}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve review tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Default to `flash` when the input is absent (e.g. API-triggered
          # workflow_dispatch without a `tier` field). The Actions UI also
          # defaults to `flash` via the input definition; the `|| 'flash'`
          # fallback keeps cost bounded for non-UI dispatch paths.
          INPUT_TIER: ${{ github.event.inputs.tier || 'flash' }}
          # Model IDs — adjust here if Google renames models.
          # Flash is ~10-20x cheaper than Pro at similar code-review quality.
          FLASH_MODEL: gemini-flash-latest
          PRO_MODEL: gemini-3.1-pro-preview
        run: |
          # Manual dispatch with `tier=pro` uses Pro (with reference tree);
          # all other paths use Flash (no reference tree, cheap).
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_TIER" = "pro" ]; then
            TIER=pro
            MODEL="$PRO_MODEL"
            LABEL="Gemini Pro"
            INCLUDE_REF=true
          else
            TIER=flash
            MODEL="$FLASH_MODEL"
            LABEL="Gemini Flash"
            INCLUDE_REF=false
          fi
          {
            echo "tier=$TIER"
            echo "model=$MODEL"
            echo "label=$LABEL"
            echo "include_reference=$INCLUDE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "🎚️ Tier: $TIER (model=$MODEL, reference_tree=$INCLUDE_REF)"

      - name: Check if trivial PR
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          METADATA=$(gh pr view "$PR_NUM" --json author,files)
          AUTHOR=$(echo "$METADATA" | jq -r '.author.login')
          FILES=$(echo "$METADATA" | jq -r '.files[].path')

          REASON=""

          # Bot authors (dependabot, renovate, etc.)
          case "$AUTHOR" in
            dependabot|dependabot\[bot\]|renovate|renovate\[bot\]|app/dependabot|app/renovate)
              REASON="Bot PR ($AUTHOR)"
              ;;
          esac

          # Docs-only changes
          if [ -z "$REASON" ] && [ -n "$FILES" ]; then
            NON_DOCS=$(echo "$FILES" | grep -vE '\.(md|mdx|txt)$|^docs/' || true)
            if [ -z "$NON_DOCS" ]; then
              REASON="Docs-only PR"
            fi
          fi

          # Lockfile-only changes
          if [ -z "$REASON" ] && [ -n "$FILES" ]; then
            NON_LOCK=$(echo "$FILES" | grep -vE '(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$' || true)
            if [ -z "$NON_LOCK" ]; then
              REASON="Lockfile-only PR"
            fi
          fi

          # Intentionally no title-based skip: PR titles lie (a "docs:" PR
          # touching code must still be reviewed), file contents don't.

          if [ -n "$REASON" ]; then
            echo "trivial=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping Gemini review: $REASON"
          else
            echo "trivial=false" >> "$GITHUB_OUTPUT"
            echo "✅ Non-trivial PR — proceeding with review"
          fi

      - name: Fetch PR diff and metadata
        id: diff
        if: steps.skip.outputs.trivial != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          # Get PR metadata (exclude .env files from the reviewed surface)
          gh pr view "$PR_NUM" --json title,body,files,baseRefName --jq '{title, body, base: .baseRefName, files: [.files[].path]}' > /tmp/pr-meta-raw.json
          jq '{title, body, base: .base, files: [.files[] | select(test("\\.env") | not)]}' \
            /tmp/pr-meta-raw.json > /tmp/pr-meta-filtered.json
          echo "Title: $(jq -r '.title' /tmp/pr-meta-filtered.json)" > /tmp/pr-meta.txt
          echo "Base: $(jq -r '.base' /tmp/pr-meta-filtered.json)" >> /tmp/pr-meta.txt
          echo "Files: $(jq -r '.files | join(" ")' /tmp/pr-meta-filtered.json)" >> /tmp/pr-meta.txt

          # Include PR description — gives Gemini author's stated intent + context.
          # Capped at 8000 chars to guard against extreme payloads, and passed
          # through a redaction pass first to strip common secret patterns
          # (PR bodies are human-authored and can contain pasted tokens or
          # env vars from repro steps).
          PR_BODY=$(jq -r '.body // ""' /tmp/pr-meta-filtered.json)
          if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
            REDACTED_BODY=$(printf '%s' "$PR_BODY" | python3 -c '
          import re, sys
          body = sys.stdin.read()
          patterns = [
            (r"(sk|pk|rk)_(test|live)_[A-Za-z0-9_-]{8,}", "[REDACTED-API-KEY]"),
            (r"ghp_[A-Za-z0-9]{20,}", "[REDACTED-GH-TOKEN]"),
            (r"gho_[A-Za-z0-9]{20,}", "[REDACTED-GH-TOKEN]"),
            (r"github_pat_[A-Za-z0-9_]{20,}", "[REDACTED-GH-PAT]"),
            (r"AIza[A-Za-z0-9_-]{30,}", "[REDACTED-GOOGLE-KEY]"),
            (r"AKIA[A-Z0-9]{16}", "[REDACTED-AWS-KEY]"),
            (r"xox[baprs]-[A-Za-z0-9-]{10,}", "[REDACTED-SLACK-TOKEN]"),
            (r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}", "[REDACTED-JWT]"),
            (r"Bearer\s+[A-Za-z0-9+/=._-]{20,}", "Bearer [REDACTED]"),
            # KEY=value style env lines (with optional "export " prefix for
            # shell-style paste): redact the value
            (r"(?im)^(?:export\s+)?([A-Z_][A-Z0-9_]*(?:KEY|SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|PRIVATE)[A-Z0-9_]*)\s*=\s*\S+", r"\1=[REDACTED]"),
          ]
          for pat, repl in patterns:
              body = re.sub(pat, repl, body)
          sys.stdout.write(body)
          ')
            {
              echo ""
              echo "PR Description:"
              printf '%s' "$REDACTED_BODY" | head -c 8000
              BODY_LEN=$(printf '%s' "$REDACTED_BODY" | wc -c)
              if [ "$BODY_LEN" -gt 8000 ]; then
                echo ""
                echo "... (truncated, original ${BODY_LEN} chars)"
              fi
              echo ""
            } >> /tmp/pr-meta.txt
          fi

          # ── 1. Diff ──
          # Exclude .env files from the diff surface as a safety net.
          gh pr diff "$PR_NUM" > /tmp/pr-raw.diff
          awk '
            /^diff --git / {
              skip = ($0 ~ /\.env/)
            }
            !skip { print }
          ' /tmp/pr-raw.diff > /tmp/pr-full.diff
          awk '
            /^diff --git / {
              skip = ($0 ~ /\.(lock|snap|map)$|pnpm-lock\.yaml|package-lock\.json|\/dist\/|\/generated\//)
            }
            !skip { print }
          ' /tmp/pr-full.diff > /tmp/pr-filtered.diff
          head -n 20000 /tmp/pr-filtered.diff > /tmp/pr.diff

          FULL_LINES=$(wc -l < /tmp/pr-filtered.diff)
          if [ "$FULL_LINES" -gt 20000 ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Diff truncated: ${FULL_LINES} lines → 20000 lines"
          fi

          # ── 2. Full content of changed files ──
          # Gives Gemini the complete picture, not just diff hunks.
          CHANGED_FILES=$(jq -r '.files[]' /tmp/pr-meta-filtered.json)
          : > /tmp/pr-files.txt
          TOTAL_FILE_LINES=0
          MAX_FILE_LINES=60000  # ~90K tokens — leaves room for diff + reference files

          # Iterate via `while read` so filenames with spaces don't get
          # word-split by the shell. `jq -r '.files[]'` emits one path per
          # line; the empty-line guard handles an empty CHANGED_FILES.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            FILE_LINES=$(wc -l < "$f")
            NEXT_TOTAL=$((TOTAL_FILE_LINES + FILE_LINES + 5))
            if [ "$NEXT_TOTAL" -gt "$MAX_FILE_LINES" ]; then
              echo "⚠️ Skipping $f (${FILE_LINES} lines) — would exceed ${MAX_FILE_LINES} line budget"
              continue
            fi
            TOTAL_FILE_LINES=$NEXT_TOTAL
            printf '\n--- FILE: %s ---\n' "$f" >> /tmp/pr-files.txt
            cat "$f" >> /tmp/pr-files.txt
          done <<< "$CHANGED_FILES"
          echo "📄 Included ${TOTAL_FILE_LINES} lines of full file content"

          # ── 3. Reference: full source of touched packages ──
          # Only included for the Pro tier (manual dispatch). Flash skips
          # this to keep tokens and cost down — the diff and full file
          # content are still included, which is enough for most findings.
          # Re-run manually with tier=pro to get full-tree context.
          : > /tmp/pr-reference.txt
          TOTAL_REF_LINES=0
          MAX_REF_LINES=50000  # ~75K tokens — generous budget for full trees

          if [ "${{ steps.tier.outputs.include_reference }}" != "true" ]; then
            echo "⏭️ Skipping reference tree (tier=${{ steps.tier.outputs.tier }})"
          else
            # Detect touched packages from changed file paths. This repo only
            # has packages/*, so the detection collapses to "whichever
            # packages were touched → include their src/".
            TOUCHED_DIRS=$(echo "$CHANGED_FILES" \
              | awk -F/ '/^packages\// { print "packages/" $2 "/src" }' \
              | sort -u)

            if [ -z "$TOUCHED_DIRS" ]; then
              echo "⏭️ No packages touched — skipping reference tree"
            else
              # Iterate via `while read` so directory names with spaces
              # don't get word-split.
              while IFS= read -r dir; do
                [ -z "$dir" ] && continue
                [ ! -d "$dir" ] && continue
                # Process substitution keeps the while loop in the current shell
                # so TOTAL_REF_LINES updates persist across iterations and dirs.
                while IFS= read -r -d '' f; do
                  # Skip files already included in changed-files section
                  echo "$CHANGED_FILES" | grep -qxF "$f" && continue
                  FILE_LINES=$(wc -l < "$f")
                  NEXT_TOTAL=$((TOTAL_REF_LINES + FILE_LINES + 5))
                  if [ "$NEXT_TOTAL" -gt "$MAX_REF_LINES" ]; then
                    echo "⚠️ Reference budget full at ${TOTAL_REF_LINES} lines, skipping remaining files"
                    break 2  # break out of both while loops
                  fi
                  TOTAL_REF_LINES=$NEXT_TOTAL
                  printf '\n--- REFERENCE: %s ---\n' "$f" >> /tmp/pr-reference.txt
                  cat "$f" >> /tmp/pr-reference.txt
                done < <(find "$dir" -type f \( -name '*.ts' -o -name '*.tsx' \) \
                  ! -path '*/__tests__/*' \
                  ! -path '*/*.spec.*' \
                  ! -path '*/*.test.*' \
                  -print0 | sort -z)
              done <<< "$TOUCHED_DIRS"
              echo "📚 Included ${TOTAL_REF_LINES} lines of reference context from: ${TOUCHED_DIRS}"
            fi
          fi

          # ── 4. Build valid file:line map from the diff ──
          # Used later to filter Gemini findings to lines that can receive
          # inline review comments. GitHub's PR review API accepts any line
          # that appears in the diff on the RIGHT side, so we include both
          # added/modified lines (^+) and context lines (^ ).
          awk '
            /^diff --git/ {
              # Match everything after " b/" to end of line to handle
              # filenames with spaces (git quotes those with double quotes).
              if (match($0, / "?b\/(.+)$/, m)) {
                file = m[1]
                sub(/"$/, "", file)  # strip trailing quote if path was quoted
              }
              next
            }
            /^@@/ {
              if (match($0, /\+([0-9]+)(,([0-9]+))?/, arr)) {
                line = arr[1] - 1
              }
              next
            }
            /^\+\+\+/ { next }
            /^\+/ {
              line++
              print file "\t" line
              next
            }
            /^ / {
              line++
              print file "\t" line
              next
            }
          ' /tmp/pr-filtered.diff > /tmp/valid-lines.tsv
          echo "📍 Mapped $(wc -l < /tmp/valid-lines.tsv) comment-eligible lines"

          # ── 5. Prior review context ──
          # On re-review, fetch the previous Gemini summary + any author
          # replies on inline-finding threads so Gemini can respect prior
          # discussion and not re-raise resolved/disputed findings.
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUM}/comments" \
            > /tmp/pr-review-comments.json
          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments" \
            > /tmp/pr-issue-comments.json

          # Extract prior Gemini summary (if any)
          jq -r '[.[] | select(.body | contains("<!-- GEMINI_REVIEW -->"))] | last | .body // ""' \
            /tmp/pr-issue-comments.json > /tmp/prior-summary.md

          # Build prior-finding threads: each Gemini inline comment + its replies.
          # Budget caps to prevent unbounded growth on long-lived PRs with many
          # pushes/reviews: keep only the 30 most-recent findings (by comment id
          # which is monotonic), and truncate individual finding/reply bodies.
          MAX_PRIOR_FINDINGS=30
          MAX_BODY_CHARS=600
          jq --argjson max_findings "$MAX_PRIOR_FINDINGS" \
             --argjson max_chars "$MAX_BODY_CHARS" '
            . as $all |
            [ $all[] | select(.body | startswith("<!-- GEMINI_INLINE -->")) ] |
            sort_by(.id) | .[-$max_findings:] |
            map(
              . as $root |
              {
                path: $root.path,
                line: $root.line,
                finding: ($root.body | if length > $max_chars then .[:$max_chars] + "…[truncated]" else . end),
                replies: [
                  $all[]
                  | select(.in_reply_to_id == $root.id)
                  | {
                      user: .user.login,
                      body: (.body | if length > $max_chars then .[:$max_chars] + "…[truncated]" else . end),
                      created_at: .created_at
                    }
                ]
              }
            )
          ' /tmp/pr-review-comments.json > /tmp/prior-findings.json

          # Cap prior summary at 4000 chars so one oversized previous comment
          # can't blow the prior-context budget on its own.
          MAX_SUMMARY_CHARS=4000
          SUMMARY_LEN=$(wc -c < /tmp/prior-summary.md)
          if [ "$SUMMARY_LEN" -gt "$MAX_SUMMARY_CHARS" ]; then
            head -c "$MAX_SUMMARY_CHARS" /tmp/prior-summary.md > /tmp/prior-summary-capped.md
            echo "" >> /tmp/prior-summary-capped.md
            echo "…[summary truncated, original ${SUMMARY_LEN} chars]" >> /tmp/prior-summary-capped.md
            mv /tmp/prior-summary-capped.md /tmp/prior-summary.md
          fi

          PRIOR_FINDING_COUNT=$(jq 'length' /tmp/prior-findings.json)
          PRIOR_REPLY_COUNT=$(jq '[.[].replies | length] | add // 0' /tmp/prior-findings.json)
          PRIOR_SUMMARY_BYTES=$(wc -c < /tmp/prior-summary.md)

          # Build prior-context section as markdown if we have anything to show
          : > /tmp/prior-context.md
          if [ "$PRIOR_SUMMARY_BYTES" -gt 10 ] || [ "$PRIOR_FINDING_COUNT" != "0" ]; then
            {
              echo "## Prior review context (this is a re-review)"
              echo ""
              if [ "$PRIOR_SUMMARY_BYTES" -gt 10 ]; then
                echo "### Your previous summary comment"
                echo ""
                cat /tmp/prior-summary.md
                echo ""
              fi
              if [ "$PRIOR_FINDING_COUNT" != "0" ]; then
                echo "### Your previous inline findings and the author's responses"
                echo "(capped at ${MAX_PRIOR_FINDINGS} most-recent findings; bodies truncated at ${MAX_BODY_CHARS} chars)"
                echo ""
                jq -r '.[] |
                  "- `" + (.path // "?") + ":" + ((.line // 0) | tostring) + "`\n" +
                  "  - Your finding: " + (.finding | gsub("<!-- GEMINI_INLINE -->\n"; "") | gsub("\n"; " ")) + "\n" +
                  (if (.replies | length) > 0
                    then "  - Replies:\n" +
                         (.replies | map("    - @" + .user + ": " + (.body | gsub("\n"; " "))) | join("\n"))
                    else "  - (no replies from author)"
                   end)
                ' /tmp/prior-findings.json
                echo ""
              fi
            } > /tmp/prior-context.md
            PRIOR_CONTEXT_BYTES=$(wc -c < /tmp/prior-context.md)
            echo "🔁 Re-review context: ${PRIOR_FINDING_COUNT} prior finding(s), ${PRIOR_REPLY_COUNT} reply/replies, ${PRIOR_CONTEXT_BYTES} bytes"
          else
            echo "🆕 First review of this PR — no prior context to include"
          fi

      - name: Review with Gemini
        id: gemini
        if: steps.skip.outputs.trivial != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_ID: ${{ steps.tier.outputs.model }}
          TIER_LABEL: ${{ steps.tier.outputs.label }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⏭️ GEMINI_API_KEY not set — skipping review"
            echo "    Add the key at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # System instruction — review persona. Lives in
          # .github/gemini-review-instructions.md so the reviewer persona
          # (priorities, stack context, PII rules) can be tuned without
          # editing the workflow itself.
          #
          # The responseSchema enforces output shape (field names,
          # severity enum) — Gemini sees both the schema and this
          # prompt, so don't restate field naming inside the
          # instructions file. The path:line prefix convention IS
          # taught in the instructions because the schema can't enforce
          # content rules inside a string field; without it, inline
          # findings can't be located back to a file:line.
          # Do not add guidance about markdown, section headers, or
          # title/summary length — that just burns thinking tokens and
          # pushes us into output-truncation territory.
          INSTRUCTIONS_FILE=".github/gemini-review-instructions.md"
          if [ ! -f "$INSTRUCTIONS_FILE" ]; then
            echo "❌ Missing $INSTRUCTIONS_FILE — required for the reviewer persona."
            exit 1
          fi
          SYSTEM_INSTRUCTION=$(cat "$INSTRUCTIONS_FILE")

          PR_META=$(cat /tmp/pr-meta.txt)
          PR_DIFF=$(cat /tmp/pr.diff)
          PR_FILES=$(cat /tmp/pr-files.txt)
          PR_REFS=$(cat /tmp/pr-reference.txt)
          PRIOR_CONTEXT=$(cat /tmp/prior-context.md 2>/dev/null || true)

          # Only emit the "Reference files" section when we actually have
          # content — on Flash tier this block is intentionally skipped, and
          # an empty heading would mislead the model about what's provided.
          if [ -s /tmp/pr-reference.txt ]; then
            REFS_SECTION=$(printf '## Reference files (existing codebase for pattern comparison)\n%s\n' "$PR_REFS")
          else
            REFS_SECTION="(Reference files were not included for this review — work from the diff and full file content above.)"
          fi

          # Write user message to file to avoid ARG_MAX on large payloads
          cat > /tmp/user_message.txt <<UMEOF
          ## PR metadata
          ${PR_META}

          ## Diff (what changed)
          \`\`\`diff
          ${PR_DIFF}
          \`\`\`

          ## Full file content (complete state of changed files)
          ${PR_FILES}

          ${REFS_SECTION}

          ${PRIOR_CONTEXT}
          UMEOF

          # Response schema for structured output — drives inline comment posting.
          # Short field names (sev/t/b) and a body-prefix convention for path:line
          # keep per-finding structural overhead low so more of the output budget
          # goes to findings rather than JSON scaffolding. The normalization step
          # below expands these back to the long-form schema that downstream
          # code expects.
          RESPONSE_SCHEMA=$(cat <<'RSEOF'
          {
            "type": "object",
            "properties": {
              "summary": { "type": "string" },
              "findings": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "sev": { "type": "string", "enum": ["critical", "suggestion", "nitpick", "question"] },
                    "t": { "type": "string" },
                    "b": { "type": "string" }
                  },
                  "required": ["sev", "t", "b"]
                }
              }
            },
            "required": ["summary", "findings"]
          }
          RSEOF
          )

          # Build JSON request with systemInstruction + user content + schema
          jq -n \
            --arg system "$SYSTEM_INSTRUCTION" \
            --rawfile user /tmp/user_message.txt \
            --argjson schema "$RESPONSE_SCHEMA" \
            '{
              systemInstruction: { parts: [{ text: $system }] },
              contents: [{ parts: [{ text: $user }] }],
              generationConfig: {
                temperature: 0.1,
                maxOutputTokens: 32000,
                thinkingConfig: { thinkingBudget: 4000 },
                responseMimeType: "application/json",
                responseSchema: $schema
              }
            }' > /tmp/request.json

          # Call Gemini (model selected by tier: flash for auto, pro for manual opt-in)
          echo "🤖 Calling ${MODEL_ID} (tier=${TIER_LABEL})"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/request.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "$RESPONSE" | sed '$d' > /tmp/response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Gemini API returned HTTP $HTTP_CODE"
            jq '.error.message // .' /tmp/response.json 2>/dev/null || cat /tmp/response.json
            exit 1
          fi

          # Extract JSON review body from Gemini's structured response.
          # Optional chaining handles SAFETY-blocked responses where
          # `.candidates[0].content` is absent entirely.
          jq -r '(.candidates[0]?.content?.parts?[0]?.text) // "{}"' /tmp/response.json > /tmp/review-raw.txt

          # Validate parse — if schema enforcement gave us valid JSON, use structured path
          if jq -e . /tmp/review-raw.txt > /dev/null 2>&1; then
            # Normalize the compact schema back to the long-form that downstream
            # code expects: expand sev/t/b → severity/title/body, and extract
            # path/line from the "PATH:LINE — body" prefix convention. The //
            # fallbacks accept legacy long-name responses without a schema bump.
            jq '
              .summary as $summary |
              (.findings // []) | map(
                . as $f |
                # Tolerate an accidental literal "PATH:" prefix — Gemini
                # occasionally echoes the placeholder name from the prompt
                # convention ("<path>:<line> — body") as actual text. Strip
                # it case-insensitively before path/line extraction so the
                # captured $m.p still maps to a valid-lines.tsv entry. The
                # normalized form is also used for the body fallback so a
                # cross-cutting finding with stray PATH: doesn't render the
                # literal prefix in the posted comment.
                (($f.b // "") | sub("^path:"; ""; "i")) as $b_norm |
                (if ($b_norm | test("^\\S+:\\d+\\s+—\\s+"))
                  then ($b_norm | capture("^(?<p>\\S+):(?<l>\\d+)\\s+—\\s+(?<rest>.*)"; "s"))
                  else null
                end) as $m |
                {
                  severity: ($f.sev // $f.severity),
                  title:    ($f.t   // $f.title),
                  body:     (if $m then $m.rest else ($b_norm // $f.body) end),
                  path:     (if $m then $m.p    else $f.path end),
                  line:     (if $m then ($m.l | tonumber) else $f.line end)
                }
              ) as $findings |
              {summary: $summary, findings: $findings}
            ' /tmp/review-raw.txt > /tmp/review.json
            echo "structured=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Structured output did not parse as JSON — using legacy text-mode fallback"
            echo "structured=false" >> "$GITHUB_OUTPUT"
            # Always emit a **Findings:** line (even with zero counts) so downstream
            # tooling can parse something.
            {
              echo "⚠️ _Gemini returned non-JSON output; raw text included below._"
              echo ""
              echo "**Findings:** 🔴 0 critical • 🟡 0 suggestion • 🟢 0 nitpick • 💡 0 question _(structured output failed — counts unavailable; see raw output below)_"
              echo ""
              cat /tmp/review-raw.txt
            } > /tmp/review.md
            exit 0
          fi

          # Severity counts
          CRITICAL=$(jq '[.findings[]? | select(.severity == "critical")] | length' /tmp/review.json)
          SUGGESTION=$(jq '[.findings[]? | select(.severity == "suggestion")] | length' /tmp/review.json)
          NITPICK=$(jq '[.findings[]? | select(.severity == "nitpick")] | length' /tmp/review.json)
          QUESTION=$(jq '[.findings[]? | select(.severity == "question")] | length' /tmp/review.json)
          TOTAL=$((CRITICAL + SUGGESTION + NITPICK + QUESTION))

          {
            echo "critical=$CRITICAL"
            echo "suggestion=$SUGGESTION"
            echo "nitpick=$NITPICK"
            echo "question=$QUESTION"
          } >> "$GITHUB_OUTPUT"

          # Build markdown review body (posted as issue comment)
          SUMMARY=$(jq -r '.summary // ""' /tmp/review.json)
          {
            echo "${SUMMARY}"
            echo ""
            echo "**Findings:** 🔴 ${CRITICAL} critical • 🟡 ${SUGGESTION} suggestion • 🟢 ${NITPICK} nitpick • 💡 ${QUESTION} question"

            for SEV in critical suggestion nitpick question; do
              case "$SEV" in
                critical)   EMOJI="🔴"; LABEL="Critical" ;;
                suggestion) EMOJI="🟡"; LABEL="Suggestion" ;;
                nitpick)    EMOJI="🟢"; LABEL="Nitpick" ;;
                question)   EMOJI="💡"; LABEL="Question" ;;
              esac
              COUNT=$(jq "[.findings[]? | select(.severity == \"$SEV\")] | length" /tmp/review.json)
              [ "$COUNT" = "0" ] && continue
              echo ""
              echo "### ${EMOJI} ${LABEL} (${COUNT})"
              echo ""
              jq -r --arg sev "$SEV" '
                .findings[]? | select(.severity == $sev) |
                "- **" + .title + "**" +
                (if .path then " — `" + .path + (if .line then ":" + (.line | tostring) else "" end) + "`" else "" end) +
                "\n\n  " + (.body | gsub("\n"; "\n  "))
              ' /tmp/review.json
            done
          } > /tmp/review.md

          # Build inline-comment payload — filter findings to those with valid path:line
          jq --rawfile valid_tsv /tmp/valid-lines.tsv '
            ($valid_tsv | split("\n") | map(select(length > 0)) | map(split("\t")) |
             map({key: (.[0] + ":" + .[1]), value: true}) | from_entries) as $valid |
            (.findings // []) |
            map(select(.path and .line and $valid[.path + ":" + (.line | tostring)])) |
            map({
              path: .path,
              line: .line,
              side: "RIGHT",
              body: (
                "<!-- GEMINI_INLINE -->\n" +
                (if .severity == "critical" then "🔴 "
                 elif .severity == "suggestion" then "🟡 "
                 elif .severity == "nitpick" then "🟢 "
                 else "💡 " end) +
                "**" + .title + "**\n\n" + .body
              )
            })
          ' /tmp/review.json > /tmp/inline-comments.json

          INLINE_COUNT=$(jq 'length' /tmp/inline-comments.json)
          echo "inline_count=$INLINE_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ Review: ${TOTAL} findings (🔴${CRITICAL} 🟡${SUGGESTION} 🟢${NITPICK} 💡${QUESTION}), ${INLINE_COUNT} inline-eligible"

      - name: Post review summary
        if: steps.skip.outputs.trivial != 'true' && steps.gemini.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          MARKER="<!-- GEMINI_REVIEW -->"
          REVIEW=$(cat /tmp/review.md)
          TRUNCATED="${{ steps.diff.outputs.truncated }}"
          INLINE_COUNT="${{ steps.gemini.outputs.inline_count }}"

          # Guard against exceeding GitHub comment size limit (65536 bytes)
          REVIEW_BYTES=$(printf '%s' "$REVIEW" | wc -c)
          if [ "$REVIEW_BYTES" -gt 60000 ]; then
            REVIEW=$(printf '%s' "$REVIEW" | python3 -c 'import sys; sys.stdout.write(sys.stdin.buffer.read()[:59000].decode("utf-8", errors="ignore"))')
            REVIEW="${REVIEW}

          > ⚠️ *Review truncated (${REVIEW_BYTES} bytes exceeded GitHub comment limit)*"
          fi

          TRUNCATION_NOTE=""
          if [ "$TRUNCATED" = "true" ]; then
            TRUNCATION_NOTE="> ⚠️ *Diff was truncated to 20,000 lines (after filtering generated/lock files). Some files may not be covered.*
          "
          fi

          INLINE_NOTE=""
          if [ -n "$INLINE_COUNT" ] && [ "$INLINE_COUNT" != "0" ]; then
            INLINE_NOTE="> 💬 *${INLINE_COUNT} finding(s) posted inline on specific lines — see the **Files changed** tab.*
          "
          fi

          TIER_LABEL="${{ steps.tier.outputs.label }}"
          COMMENT_BODY="${MARKER}
          ## 🔍 ${TIER_LABEL} Review

          ${TRUNCATION_NOTE}${INLINE_NOTE}
          ${REVIEW}

          ---
          *Automated review by ${TIER_LABEL} via Google AI Studio • [Re-run](https://github.com/${{ github.repository }}/actions/workflows/gemini-review.yml) (pick \`tier: pro\` for a deeper review with full reference-tree context)*"

          # Manual re-runs always post a fresh comment so the review
          # history is visible; automatic runs update in place to avoid
          # flooding the PR on every push.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh pr comment "$PR_NUM" --body "$COMMENT_BODY"
            echo "✅ Posted new review comment (manual dispatch)"
          else
            EXISTING_COMMENT_ID=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUM}/comments" \
              --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
              | head -1)

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              gh api \
                "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
                -X PATCH \
                -f body="$COMMENT_BODY"
              echo "✅ Updated existing review comment #${EXISTING_COMMENT_ID}"
            else
              gh pr comment "$PR_NUM" --body "$COMMENT_BODY"
              echo "✅ Posted new review comment"
            fi
          fi

      - name: Post inline findings
        if: >-
          steps.skip.outputs.trivial != 'true'
          && steps.gemini.outputs.skipped != 'true'
          && steps.gemini.outputs.structured == 'true'
          && steps.gemini.outputs.inline_count != '0'
          && steps.gemini.outputs.inline_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          INLINE_COUNT="${{ steps.gemini.outputs.inline_count }}"

          # Clean up prior Gemini inline comments, but ONLY those with no
          # replies. Humans took the time to reply — deleting the parent
          # would orphan their replies and lose the discussion context that
          # the re-review prompt relies on.
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PR_NUM}/comments" \
            > /tmp/all-review-comments.json

          # IDs of Gemini inline comments that have been replied to
          REPLIED_IDS=$(jq -r '
            [ .[] | select(.in_reply_to_id != null) | .in_reply_to_id ] as $parents |
            [ .[] | select((.body | startswith("<!-- GEMINI_INLINE -->")) and (.id | IN($parents[]))) | .id ] |
            .[]
          ' /tmp/all-review-comments.json)

          # IDs of Gemini inline comments with zero replies — safe to delete
          DELETABLE_IDS=$(jq -r --argjson replied "$(echo "$REPLIED_IDS" | jq -R . | jq -s 'map(tonumber? // empty)')" '
            [ .[] | select((.body | startswith("<!-- GEMINI_INLINE -->")) and (.id | IN($replied[]) | not)) | .id ] |
            .[]
          ' /tmp/all-review-comments.json)

          DELETE_COUNT=$(echo "$DELETABLE_IDS" | grep -c . || true)
          PRESERVED_COUNT=$(echo "$REPLIED_IDS" | grep -c . || true)

          if [ "$DELETE_COUNT" != "0" ]; then
            echo "🧹 Deleting ${DELETE_COUNT} stale Gemini finding(s) with no replies"
            echo "$DELETABLE_IDS" | while read -r id; do
              [ -z "$id" ] && continue
              gh api -X DELETE "repos/${{ github.repository }}/pulls/comments/${id}" \
                --silent || echo "  ⚠️ Failed to delete comment $id (may have been deleted already)"
            done
          fi
          if [ "$PRESERVED_COUNT" != "0" ]; then
            echo "💬 Preserving ${PRESERVED_COUNT} prior Gemini finding(s) with replies"
          fi

          # Build review payload and submit as a formal PR review (event=COMMENT)
          HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid')

          jq -n \
            --arg commit "$HEAD_SHA" \
            --slurpfile comments /tmp/inline-comments.json \
            '{
              commit_id: $commit,
              body: "<!-- GEMINI_REVIEW_INLINE --> Inline findings from ${{ steps.tier.outputs.label }}. See summary comment for the full review.",
              event: "COMMENT",
              comments: $comments[0]
            }' > /tmp/review-payload.json

          HTTP_CODE=$(curl -s -o /tmp/review-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}/reviews" \
            -d @/tmp/review-payload.json)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Posted ${INLINE_COUNT} inline finding(s) as formal review"
          else
            echo "⚠️ Formal review failed (HTTP ${HTTP_CODE}) — inline comments not posted"
            echo "    (summary comment was still posted; this is non-fatal)"
            jq '.' /tmp/review-response.json 2>/dev/null || cat /tmp/review-response.json
          fi
